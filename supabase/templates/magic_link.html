<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seu código do Juntos: {{ .Token }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#1a2238;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#1a2238;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background-color:#f3ebe3;border-radius:24px;padding:32px 28px;font-family:Helvetica,Arial,sans-serif;color:#1a2238;">
            <tr>
              <td style="font-size:13px;font-weight:bold;letter-spacing:4px;text-transform:uppercase;color:#c45c3e;">
                Juntos
              </td>
            </tr>
            <tr>
              <td style="padding-top:16px;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.25;">
                Oi! Seu código para entrar no Juntos é:
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 0;">
                <span style="display:inline-block;background-color:#ffffff;border:2px solid #c45c3e;border-radius:16px;padding:16px 20px;font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:bold;letter-spacing:10px;color:#1a2238;">{{ .Token }}</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:16px;line-height:1.5;color:#1a2238;">
                Ele vale por 10 minutos. Se não foi você, é só ignorar 💛
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
